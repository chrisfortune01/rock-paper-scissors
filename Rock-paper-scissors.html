<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame('rock');"> Rock</button>

    <button onclick="playGame('paper');"> Paper</button>

    <button onclick="playGame('scissors');"> Scissors</button>

    <button onclick="resetScore()">Reset Scores</button>

    <script>
    const score = JSON.parse(localStorage.getItem('rpsScore')) || {
        userScore: 0,
        computerScore: 0,
        tieScore: 0,
    };
    // const savedScore = localStorage.getItem('rpsScore');
    // if (savedScore) {
    //     Object.assign(score, JSON.parse(savedScore));
    // }
    
    function playGame(userChoice) {
        const randomNumber = Math.random();
        let computerChoice;
        
        if (randomNumber < 1/3) {
            computerChoice = 'rock';
        } else if (randomNumber < 2/3) {
            computerChoice = 'paper';
        } else {
            computerChoice = 'scissors';
        }
        
        // console.log(`Computer picks ${computerChoice}`);
        
        if (userChoice === computerChoice) {
            score.tieScore++;
            (alert(`You picked ${userChoice}. Computer picked ${computerChoice}. It\'s a tie!.\n Your score: ${score.userScore} Computer score: ${score.computerScore} Ties: ${score.tieScore}`));
        } else if (
            (userChoice === 'rock' && computerChoice === 'scissors') ||
            (userChoice === 'paper' && computerChoice === 'rock') ||
            (userChoice === 'scissors' && computerChoice === 'paper')
        ) {
            score.userScore++;
            alert(`You picked ${userChoice}. Computer picked ${computerChoice}. You win!.\n Your score: ${score.userScore} Computer score: ${score.computerScore} Ties: ${score.tieScore}`);
        } else {
            score.computerScore++;
            alert(`You picked ${userChoice}. Computer picked ${computerChoice}. Computer wins!.\n Your score: ${score.userScore} Computer score: ${score.computerScore} Ties: ${score.tieScore}`);
        }
        localStorage.setItem('rpsScore', JSON.stringify(score));
        return console.log(`Computer picks ${computerChoice}`);
    }
    
    function resetScore() { 
        localStorage.removeItem('rpsScore');
        score.userScore = 0;
        score.computerScore = 0;
        score.tieScore = 0;
        console.log(alert(`Scores have been reset.\n Your score: ${score.userScore} Computer score: ${score.computerScore} Ties: ${score.tieScore}`));
    }
    
    </script>
</body>
</html>
