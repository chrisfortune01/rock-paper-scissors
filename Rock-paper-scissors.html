<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <p>Rock Paper Scissors</p>
    <button onclick="playGame('rock');"> Rock</button>

    <button onclick="playGame('paper');"> Paper</button>

    <button onclick="playGame('scissors');"> Scissors</button>
    
    <p class="js-result"></p>
    <p class="js-choices"></p>
    <p class="js-score"></p>

    <button onclick="resetScore()">Reset Scores</button>

    <script>
    const score = JSON.parse(localStorage.getItem('rpsScore')) || {
        userScore: 0,
        computerScore: 0,
        tieScore: 0,
    };
    let result;
    // const savedScore = localStorage.getItem('rpsScore');
    // if (savedScore) {
    //     Object.assign(score, JSON.parse(savedScore));
    // }
    function updateScore() {
    document.querySelector(".js-score")
        .innerHTML = `Your score: ${score.userScore}, Computer score: ${score.computerScore}, Ties: ${score.tieScore}`;
    }
    updateScore()

    function playGame(userChoice) {
        const randomNumber = Math.random();
        let computerChoice;
        
        if (randomNumber < 1/3) {
            computerChoice = 'rock';
        } else if (randomNumber < 2/3) {
            computerChoice = 'paper';
        } else {
            computerChoice = 'scissors';
        }
        
        if (userChoice === computerChoice) {
            score.tieScore++;
            result = "It's a tie.";
        } else if (
            (userChoice === 'rock' && computerChoice === 'scissors') ||
            (userChoice === 'paper' && computerChoice === 'rock') ||
            (userChoice === 'scissors' && computerChoice === 'paper')
        ) {
            score.userScore++;
            result = 'You win.';
        } else {
            score.computerScore++;
            result = 'You lose.';    
        }
        localStorage.setItem('rpsScore', JSON.stringify(score));
        document.querySelector(".js-result").innerHTML = result;
        document.querySelector(".js-choices").innerHTML = `You picked ${userChoice}. Computer picked ${computerChoice}.`;
        updateScore();
        // return console.log(`Computer picks ${computerChoice}`);
    }
    
    function resetScore() { 
        localStorage.removeItem('rpsScore');
        score.userScore = 0;
        score.computerScore = 0;
        score.tieScore = 0;
        document.querySelector(".js-result").innerHTML = '';
        document.querySelector(".js-choices").innerHTML ='';
        updateScore();
        // return console.log('Scores have been reset!')
    }
    
    </script>
</body>
</html>
